name: Testes E2E com Cypress e Cucumber

on:
  push:
    branches: [ "develop", "main" ]
  workflow_dispatch:
    
jobs:
  cypress-run:
    name: Execução do Cypress
    runs-on: ubuntu-latest
    steps:
      # Verifica (faz checkout) o seu repositório no $GITHUB_WORKSPACE para o job poder acessá-lo
      - name: Verificar repositório
        uses: actions/checkout@v6
      
      # Executa os testes automatizados utilizando a action oficial do Cypress
      - name: Executar testes Cypress
        # Utiliza a action oficial do Cypress no GitHub: https://github.com/cypress-io/github-action
        uses: cypress-io/github-action@v7
        with:
          # Registra os resultados no Cypress Cloud
          # https://docs.cypress.io/cloud/get-started/setup
          record: true
        env:
          # Para gravação e paralelização, você deve configurar a sua CYPRESS_RECORD_KEY
          # em Repositório do GitHub → Settings → Secrets and variables → Actions
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          # Crie um token caso necessário: https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/creating-a-personal-access-token
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      # Copia os vídeos e capturas de tela gerados durante a execução dos testes
      - name: Copiar vídeos e capturas de tela dos testes
        run: |
          mkdir public
          cp -r cypress/reports/html public/reports

      # Publica a página de relatório gerada no GitHub Pages
      - name: Publicar página de relatório
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages